[project]
name = "tune-to-tab"
version = "0.1.0"
description = "Separate the instruments of an audio track and generate guitar and bass tabs"
readme = "README.md"
requires-python = ">=3.10,<3.12"
dependencies = [
    "demucs>=4.0.1",
    "basic-pitch>=0.4.0",
    "soundfile>=0.12",
    "librosa>=0.10",
    "numpy<2",
    "fpdf2>=2.7",
    "pyguitarpro>=0.9",
]

[project.scripts]
tune-to-tab = "tune_to_tab.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tune_to_tab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
